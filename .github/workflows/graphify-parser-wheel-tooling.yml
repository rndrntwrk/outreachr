name: Graphify parser wheel tooling (ephemeral)

on:
  pull_request:
    branches:
      - graphify/tooling-tree-sitter-base-20260820

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          check-latest: false

      - name: Download pinned parser wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps \
            tree-sitter==0.25.2 \
            tree-sitter-typescript==0.23.2 \
            --dest wheels
          sha256sum wheels/* | sort | tee wheels/SHA256SUMS
          python - <<'PY' > wheels/ENVIRONMENT.txt
          import platform
          print(platform.python_version())
          print(platform.platform())
          PY

      - name: Upload parser wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graphify-parser-wheels-python313
          path: wheels/**
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: false
