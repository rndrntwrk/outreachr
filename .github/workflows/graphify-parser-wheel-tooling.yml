name: Graphify parser wheel tooling (ephemeral)

on:
  push:
    branches:
      - graphify/tooling-tree-sitter-head-20260820
    paths:
      - .github/workflows/graphify-parser-wheel-tooling.yml
      - .graphify-parser-wheel-trigger

permissions:
  contents: write

jobs:
  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          check-latest: false

      - name: Download pinned parser wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps \
            tree-sitter==0.25.2 \
            tree-sitter-typescript==0.23.2 \
            tree-sitter-json==0.24.8 \
            --dest wheels
          sha256sum wheels/* | sort | tee wheels/SHA256SUMS
          python - <<'PY' > wheels/ENVIRONMENT.txt
          import platform
          print(platform.python_version())
          print(platform.platform())
          PY

      - name: Upload parser wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graphify-parser-wheels-python313-json
          path: wheels/**
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: false

      - name: Publish ephemeral run pointer
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.graphify-parser-wheel-run-pointer.json"
          branch="graphify/tooling-tree-sitter-head-20260820"
          existing_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api?ref=graphify%2Ftooling-tree-sitter-head-20260820" | jq -r '.sha // empty' 2>/dev/null || true)"
          pointer="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event_sha "$GITHUB_SHA" \
            --arg artifact "graphify-parser-wheels-python313-json" \
            --arg job_status "$JOB_STATUS" \
            '{repository:$repository,run_id:$run_id,run_attempt:$run_attempt,event_sha:$event_sha,artifact_name:$artifact,job_status:$job_status}')"
          encoded="$(printf '%s\n' "$pointer" | base64 -w0)"
          if [ -n "$existing_sha" ]; then
            payload="$(jq -n --arg message "chore: update ephemeral parser-wheel run pointer" --arg content "$encoded" --arg branch "$branch" --arg sha "$existing_sha" '{message:$message,content:$content,branch:$branch,sha:$sha}')"
          else
            payload="$(jq -n --arg message "chore: publish ephemeral parser-wheel run pointer" --arg content "$encoded" --arg branch "$branch" '{message:$message,content:$content,branch:$branch}')"
          fi
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$payload" >/dev/null
